name: ci
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - name: ink live render inside a pty
        run: |
          python3 - <<'PY'
          import pty, os, sys, time, select
          master, slave = pty.openpty()
          proc = os.forkpty() if False else None
          import subprocess
          p = subprocess.Popen(["bun", "packages/tui/ink-hello.tsx"], stdin=slave, stdout=slave, stderr=slave, env=dict(os.environ, TERM="xterm-256color"))
          os.close(slave)
          buf = b""
          end = time.time() + 5
          while time.time() < end:
              r, _, _ = select.select([master], [], [], 0.2)
              if r:
                  try: c = os.read(master, 65536)
                  except OSError: break
                  if not c: break
                  buf += c
          p.terminate()
          print("BYTES:", len(buf))
          print(repr(buf[:2000]))
          PY
