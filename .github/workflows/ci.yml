# CI (#236): the suite's health was invisible without bare metal — the
# Linux test-failure report in #236 would have been caught here first.
# PTY tests run too: python3 is present on ubuntu runners, and the
# readiness-wait harness (#236) made their budgets host-independent.
name: ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test suite
        run: bun test
