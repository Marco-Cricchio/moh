# CI (#236): the suite's health was invisible without bare metal — the
# Linux test-failure report in #236 would have been caught here first.
#
# PR-only (#441): every merge to develop goes through a PR, and the PR run
# already tested that exact tree — a push:develop run would duplicate ~6 min
# per merge. Requires "test" checks to be required on develop (branch
# protection); see docs below.
#
# Jobs run in parallel (wall time = slowest job, not the sum):
#   typecheck  — bun run typecheck (~30s)
#   core       — packages/core + packages/extension
#   cli        — packages/cli
#   scripts    — build/install/platform-vocabulary tests plus the
#                compiled-binary gate (#1068: compiles the release artifact
#                and runs mock sessions against it — ~1s on CI, a few
#                seconds locally); the release pipeline's only automated
#                coverage, since a tag-triggered release workflow cannot be
#                exercised on a PR
#   tui-unit   — TUI component/ink tests (non-PTY), one retry on failure
#                (frame assertions that race a slow paint, #930)
#   tui-pty    — the small real-terminal integration gate: startup, raw keys,
#                alternate-screen restore, resize, --no-color and image
#                protocols; one bounded batch, no test retry
#
# Release PRs (CHANGELOG.md + version bump only) skip CI via paths-ignore:
# the tagged tree is the develop tree the PR checks already covered.
name: ci

# The test jobs run one exact Bun. `latest` made the gate a moving
# target (#1061): the runner resolved 1.4.2 while a local checkout ran
# 1.2.19, so "green on CI" and "green locally" were different claims.
# Pinned to the version this suite was last verified green on; bumping it
# is a deliberate change reviewed like any other, not a side effect of a
# PR that happened to run that day.
env:
  BUN_VERSION: "1.4.2"

on:
  pull_request:
    branches: [develop]
    # No paths-ignore: branch protection on develop requires the five CI
    # contexts unconditionally, so a skipped run (e.g. a changelog-only
    # release PR) leaves the PR blocked forever. Changelog/package.json-only
    # PRs just run the full suite like everything else.

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test packages/core packages/extension

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test packages/cli

  # Scripts tests (#916): the compile targets, the release matrix, the
  # installer's uname mapping and the self-update vocabulary are four copies
  # of one platform list, and the release workflow that consumes them only
  # runs on a tag — so this cheap job is where they are reconciled on a PR.
  # #1068 added the compiled-binary gate here for the same reason: the
  # artifact's module resolution lives only in a compiled binary, and the
  # release smoke test is the one gate a PR never runs.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test scripts

  # Eval harness (#524): deterministic, mock-backed task suites against the
  # real headless path. Cheap — run it on every PR already touching core/cli.
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun packages/evals/run.ts --json

  tui-unit:
    runs-on: ubuntu-latest
    # 10 min was enough for one pass; the retry needs room for a second one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Non-PTY TUI tests only (top-level test dir); the PTY tail runs in
      # its own job below. Globs avoid bun --exclude, which this version
      # ignores for directory args. The retry mirrors tui-pty: known
      # load-dependent flakes (frame reads racing a slow paint, #930) pass
      # when the job is re-run, so the job re-runs itself once instead of
      # asking a human to press the button.
      - name: TUI unit tests (retry once)
        run: |
          set +e
          globs="packages/tui/test/*.test.ts packages/tui/test/*.test.tsx"
          bun test --preload ./packages/tui/test/faketty/ci-mask.ts $globs
          first=$?
          if [ "$first" -eq 0 ]; then
            exit 0
          fi
          echo "::warning::tui-unit failed on the first attempt (exit $first) — re-running the same globs once. A flake that only passes on the retry is still a flake to fix (#930)."
          sleep 5
          bun test --preload ./packages/tui/test/faketty/ci-mask.ts $globs
          second=$?
          if [ "$second" -ne 0 ]; then
            echo "::error::tui-unit failed twice (first exit $first, retry exit $second) — treat it as a real failure, not a flake."
            exit "$second"
          fi
          exit 0

  tui-pty:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The remaining PTY files are independent process-boundary claims.
      # Keep one worker on the runner: this is a gate for real-terminal
      # semantics, not a throughput benchmark, and it has no retry path.
      - name: PTY integration gate
        run: MOH_PTY_JOBS=1 bash scripts/test-pty-parallel.sh

  # Skills-index drift guard: the upstream index.json IS the skills update
  # channel served raw from main — a stale index shipped a downgrade offer
  # to every install each launch (the #372-style apply/launch-sync loop).
  # Fail (block) when the committed index does not match the bundled skills.
  skills-index-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Fail when skills index.json is stale
        run: |
          bun scripts/gen-skills-index.ts >/dev/null
          if ! git diff --quiet -- packages/core/assets/skills/index.json; then
            echo "::error::packages/core/assets/skills/index.json is stale — run 'bun scripts/gen-skills-index.ts' and commit the result whenever a bundled skill changes."
            git diff -- packages/core/assets/skills/index.json | head -20
            exit 1
          fi

  # Manual-drift heuristic (#457): warn — never block — when a PR changes a
  # user-visible door (slash commands, the COMMANDS panel, CLI usage texts,
  # the config schema) without touching docs/manual/. The light-alignment
  # rule for the manual lives in AGENTS.md.
  manual-drift-warning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Warn when doors change without the manual
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          doors=$(echo "$changed" | grep -E '^packages/tui/src/(commands|CommandsPanel)\.tsx?$|^packages/cli/src/[^/]+\.ts$|^packages/core/src/(config|user-config)\.ts$' || true)
          manual=$(echo "$changed" | grep -E '^docs/manual/|^packages/core/src/manual/' || true)
          if [ -n "$doors" ] && [ -z "$manual" ]; then
            echo "::warning::This PR changes user-visible surfaces (commands/CLI/config) without touching docs/manual/ — check whether a manual page needs the same change (see AGENTS.md, 'User manual')."
          fi
