name: ci
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - name: ink live render inside a controlling pty
        run: |
          python3 - <<'PY'
          import os, time, select, subprocess, fcntl, termios, signal
          master, slave = pty_pair = os.openpty()
          fcntl.ioctl(slave, termios.TIOCSWINSZ, b"\x2d\x00\xa0\x00\x00\x00\x00\x00")  # 45 rows, 160 cols
          def make_ctty():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          p = subprocess.Popen(["bun", "packages/tui/ink-hello.tsx"], stdin=slave, stdout=slave, stderr=slave,
                               preexec_fn=make_ctty, env=dict(os.environ, TERM="xterm-256color"))
          os.close(slave)
          buf = b""
          end = time.time() + 4
          while time.time() < end:
              r, _, _ = select.select([master], [], [], 0.2)
              if r:
                  try: c = os.read(master, 65536)
                  except OSError: break
                  if not c: break
                  buf += c
          p.terminate()
          print("BYTES:", len(buf))
          print(buf[:1500])
          PY
