# CI (#236): the suite's health was invisible without bare metal — the
# Linux test-failure report in #236 would have been caught here first.
#
# PR-only (#441): every merge to develop goes through a PR, and the PR run
# already tested that exact tree — a push:develop run would duplicate ~6 min
# per merge. Requires "test" checks to be required on develop (branch
# protection); see docs below.
#
# Jobs run in parallel (wall time = slowest job, not the sum):
#   typecheck  — bun run typecheck (~30s)
#   core       — packages/core + packages/extension
#   tui-unit   — TUI component/ink tests (non-PTY)
#   tui-pty    — PTY integration tests, the slow tail (~3min), one retry on
#                failure (known load-dependent flakes pass in isolation)
#
# Release PRs (CHANGELOG.md + version bump only) skip CI via paths-ignore:
# the tagged tree is the develop tree the PR checks already covered.
name: ci

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - "CHANGELOG.md"
      - "package.json"
      - "**/package.json"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test packages/core packages/extension

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test packages/cli

  tui-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Non-PTY TUI tests only (top-level test dir); the PTY tail runs in
      # its own job below. Globs avoid bun --exclude, which this version
      # ignores for directory args.
      - run: bun test packages/tui/test/*.test.ts packages/tui/test/*.test.tsx

  tui-pty:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # One retry on failure: the PTY suite has known load-dependent flakes
      # that pass in isolation; a green run pays no retry cost.
      - name: PTY tests (retry once)
        run: |
          set +e
          bun test packages/tui/test/pty
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning::PTY suite failed on first attempt — retrying once"
            sleep 5
            bun test packages/tui/test/pty
            status=$?
          fi
          exit $status

  # Skills-index drift guard: the upstream index.json IS the skills update
  # channel served raw from main — a stale index shipped a downgrade offer
  # to every install each launch (the #372-style apply/launch-sync loop).
  # Fail (block) when the committed index does not match the bundled skills.
  skills-index-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Fail when skills index.json is stale
        run: |
          bun scripts/gen-skills-index.ts >/dev/null
          if ! git diff --quiet -- packages/core/assets/skills/index.json; then
            echo "::error::packages/core/assets/skills/index.json is stale — run 'bun scripts/gen-skills-index.ts' and commit the result whenever a bundled skill changes."
            git diff -- packages/core/assets/skills/index.json | head -20
            exit 1
          fi

  # Manual-drift heuristic (#457): warn — never block — when a PR changes a
  # user-visible door (slash commands, the COMMANDS panel, CLI usage texts,
  # the config schema) without touching docs/manual/. The light-alignment
  # rule for the manual lives in AGENTS.md.
  manual-drift-warning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Warn when doors change without the manual
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          doors=$(echo "$changed" | grep -E '^packages/tui/src/(commands|CommandsPanel)\.tsx?$|^packages/cli/src/[^/]+\.ts$|^packages/core/src/(config|user-config)\.ts$' || true)
          manual=$(echo "$changed" | grep -E '^docs/manual/|^packages/core/src/manual/' || true)
          if [ -n "$doors" ] && [ -z "$manual" ]; then
            echo "::warning::This PR changes user-visible surfaces (commands/CLI/config) without touching docs/manual/ — check whether a manual page needs the same change (see AGENTS.md, 'User manual')."
          fi
