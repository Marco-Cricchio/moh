name: ci
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: PTY debug
        run: bun test packages/tui/test/pty/pty-layout.test.ts -t "wide terminal"
      - name: Dump raw
        if: always()
        run: |
          ls -la /tmp/moh-pty* 2>/dev/null || true
          head -c 3000 /tmp/moh-pty-*.bin 2>/dev/null | cat -v || echo "no dump"
