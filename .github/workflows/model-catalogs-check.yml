# ADR-0046: verify reviewed inputs separately from observing changing sources.
name: model-catalogs-check

on:
  pull_request:
    paths:
      - "packages/core/src/model-catalogs/**"
      - "packages/core/scripts/build-model-catalogs.ts"
      - "packages/core/scripts/model-catalog-build.ts"
      - ".github/workflows/model-catalogs-check.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Reproduce reviewed artifacts offline and guard changes against the PR base
        env:
          CATALOG_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun packages/core/scripts/build-model-catalogs.ts --check --baseline "$CATALOG_BASE_SHA"

  monitor:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Report live source changes without rewriting the catalog
        run: |
          set -o pipefail
          bun packages/core/scripts/build-model-catalogs.ts --freshness --report catalog-review.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog-source-review
          path: catalog-review.json
          if-no-files-found: warn
          retention-days: 30
