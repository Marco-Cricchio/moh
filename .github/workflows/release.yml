# CI release pipeline (#268): tag-triggered builds + GitHub Release.
# Spec: docs/spec/cli-binary-distribution.md (decision 6, invariant 4) · ADR-0013.
#
# Pushing a `v*` tag builds the platform binaries on native runners
# (build.ts compiles per-target; #266), smoke-tests each one natively
# (--version must match the tag; a mock-provider headless run), then a
# release job assembles checksums.txt and opens a draft GitHub Release with
# the binaries + checksums. Release binaries are reproducible from CI
# only (invariant 4): no manual binary is ever attached.
# The Homebrew tap (Marco-Cricchio/homebrew-moh) follows published releases
# automatically via its own update-tap workflow — nothing to do here. (#270)
#
# `catalog-check` (ADR-0046, amended by #1005) also runs here: at every tag it
# rebuilds the catalog from the declared aggregators, compares it with the
# committed tree, and REPORTS — the committed catalog's age against the tagged
# commit, how many files moved upstream, how many guard findings — into the run
# summary. It never fails on drift and is deliberately not a `needs` of
# `release`: a release ships the last valid committed catalog, and at a ~4-5
# hour drift window a red at every tag was the steady state, which is a signal
# that distinguishes nothing. The drift compare that fails still runs daily and
# on catalog PRs (model-catalogs-check.yml).
#
# `version-check` IS a `needs` of `release`: it enforces the version contract
# (ADR-0029 + ADR-0046, #1005). Regenerating the catalog declaring the release
# being cut is a step of the release flow before the tag (CONTRIBUTING.md); a
# manifest that declares a different release than the tag must not become a
# Release, because `PRICING_SNAPSHOT.version` is a public export read from it —
# v0.50.1 shipped a manifest declaring 0.50.0.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read # default token must clone the (private) repo; release job elevates to write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-latest # arm64
          - platform: darwin-x64
            os: macos-15-intel # x64 (macos-13 runner retired)
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm # free for public repos; native build + smoke test, no cross-testing (#916)
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build binary
        run: bun scripts/build.ts ${{ matrix.platform }}
      - name: Smoke test — version matches tag
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          actual="$(./dist/moh-${{ matrix.platform }} --version)"
          expected="${EXPECTED_TAG#v}"
          echo "version: $actual (expected $expected)"
          [ "$actual" = "$expected" ]
      - name: Smoke test — headless run (mock provider)
        env:
          HOME: ${{ runner.temp }}/smoke-home
        run: |
          mkdir -p "$HOME" "$RUNNER_TEMP/smoke-project"
          cd "$RUNNER_TEMP/smoke-project"
          out="$("$GITHUB_WORKSPACE/dist/moh-${{ matrix.platform }}" run --provider mock "say hi")"
          echo "$out" | grep -q '"type":"done"' || { echo 'headless smoke: no done event'; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: moh-${{ matrix.platform }}
          path: dist/moh-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  # ADR-0046 amendment (#1005): at every release, rebuild the catalog from the
  # live aggregators, compare it with the committed tree at the tagged commit,
  # and report — the age of the data being shipped, how far upstream has moved,
  # and which rows moved. Deliberately not a `needs` of `release` and
  # deliberately never failing on drift: the release ships the last valid
  # committed catalog, so this is the diagnostic a human reads before tagging
  # the next one. No flavour of drift turns it red — a rebuild the guards
  # reject reports less (age and drifted files; the row-level counts read `--`)
  # rather than failing. It fails only when it cannot measure at all: a source
  # that could not be fetched, where there is no honest report to print.
  catalog-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # at the tagged commit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Report catalog freshness (never fails on drift)
        run: |
          set -o pipefail
          bun packages/core/scripts/build-model-catalogs.ts --freshness --at "$(git log -1 --format=%cI)" | tee -a "$GITHUB_STEP_SUMMARY"

  # The version contract (ADR-0029 + ADR-0046 amendment, #1005): the catalog a
  # release ships must declare that release, because PRICING_SNAPSHOT.version
  # (a public export) reads it from the manifest. Read-only and offline: it
  # loads the committed manifest and nothing else, and it gates publication —
  # a mismatch never becomes a draft Release.
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: The catalog declares the release being tagged
        run: bun packages/core/scripts/build-model-catalogs.ts --verify-version "${GITHUB_REF_NAME#v}"

  release:
    needs: [build, version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v7 # CHANGELOG.md at the tagged commit
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum moh-* > checksums.txt
          cat checksums.txt
          sha256sum -c checksums.txt
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          BODY=$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(printf %s "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no [${VERSION}] section (or it is empty) at tag $TAG"
            exit 1
          fi
          printf %s "$BODY" > release-notes.md
          head -5 release-notes.md
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: |
            dist/moh-*
            dist/checksums.txt
