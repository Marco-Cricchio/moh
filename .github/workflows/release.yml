# CI release pipeline (#268): tag-triggered builds + GitHub Release.
# Spec: docs/spec/cli-binary-distribution.md (decision 6, invariant 4) · ADR-0013.
#
# Pushing a `v*` tag builds the platform binaries on native runners
# (build.ts compiles per-target; #266), smoke-tests each one natively
# (--version must match the tag; a mock-provider headless run), then a
# release job assembles checksums.txt and opens a draft GitHub Release with
# the binaries + checksums. Release binaries are reproducible from CI
# only (invariant 4): no manual binary is ever attached.
# The Homebrew tap (Marco-Cricchio/homebrew-moh) follows published releases
# automatically via its own update-tap workflow — nothing to do here. (#270)
#
# `catalog-check` (ADR-0046) also runs here: at every release, rebuild the
# model catalog from the declared aggregators and compare it with the
# committed tree — the exact commit being shipped, not the last scheduled
# run. It is deliberately NOT a dependency of `release`: a release ships the
# last valid committed catalog, so a failure here is a data-quality signal
# for the owner, never a release blocker. Either failure mode counts as the
# recorded trigger to revisit the catalog-ownership decision: drift against
# the committed tree, or a source that could not be fetched.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read # default token must clone the (private) repo; release job elevates to write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-latest # arm64
          - platform: darwin-x64
            os: macos-15-intel # x64 (macos-13 runner retired)
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm # free for public repos; native build + smoke test, no cross-testing (#916)
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build binary
        run: bun scripts/build.ts ${{ matrix.platform }}
      - name: Smoke test — version matches tag
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          actual="$(./dist/moh-${{ matrix.platform }} --version)"
          expected="${EXPECTED_TAG#v}"
          echo "version: $actual (expected $expected)"
          [ "$actual" = "$expected" ]
      - name: Smoke test — headless run (mock provider)
        env:
          HOME: ${{ runner.temp }}/smoke-home
        run: |
          mkdir -p "$HOME" "$RUNNER_TEMP/smoke-project"
          cd "$RUNNER_TEMP/smoke-project"
          out="$("$GITHUB_WORKSPACE/dist/moh-${{ matrix.platform }}" run --provider mock "say hi")"
          echo "$out" | grep -q '"type":"done"' || { echo 'headless smoke: no done event'; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: moh-${{ matrix.platform }}
          path: dist/moh-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  # ADR-0046 revisit trigger: at every release, rebuild the catalog from the
  # live aggregators and compare it with the committed tree at the tagged
  # commit. Deliberately not a `needs` of `release`: the release ships the
  # last valid committed catalog, so this job's failure is a signal to look,
  # never a gate. The generator's own report is the diagnostic.
  catalog-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Rebuild and compare (no write)
        run: bun packages/core/scripts/build-model-catalogs.ts --check

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v7 # CHANGELOG.md at the tagged commit
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum moh-* > checksums.txt
          cat checksums.txt
          sha256sum -c checksums.txt
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          BODY=$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(printf %s "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no [${VERSION}] section (or it is empty) at tag $TAG"
            exit 1
          fi
          printf %s "$BODY" > release-notes.md
          head -5 release-notes.md
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: |
            dist/moh-*
            dist/checksums.txt
