name: Bug report
description: Something in moh is broken or behaves unexpectedly
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the
        details below — run `moh --version` to get your version.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `moh`
        2. Press …
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `moh --version`, plus OS/arch (`uname -sm`) and install method (binary or from source).
      placeholder: |
        - moh version: 0.x.y
        - OS: macOS arm64
        - Install: binary
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: |
        Any error output. Please redact secrets and anything project-private
        before pasting — session logs may contain code from your project.
    validations:
      required: false
