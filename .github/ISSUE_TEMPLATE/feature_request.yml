name: Feature request
description: Propose an improvement or new capability for moh
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Describe the problem you are trying to
        solve — the "why" matters more than the specific "how".
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen. Alternatives you considered are welcome.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `moh --version`, plus OS/arch (`uname -sm`), if relevant.
    validations:
      required: false
